# Attaches HibiraOnline.js to each published GitHub Release. The release tag
# must be v<version from package.json>, e.g. v0.1.0.
name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm test
      - run: gh release upload "$GITHUB_REF_NAME" dist/HibiraOnline.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
