# Attaches HibiraOnline.js to each published GitHub Release. The release tag
# must be v<version from package.json>, e.g. v0.1.0.
name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm test
      - run: gh release upload "$GITHUB_REF_NAME" dist/HibiraOnline.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
